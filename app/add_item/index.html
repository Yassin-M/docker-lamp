<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Karta gehitu</title>
        <link rel="stylesheet" href="../css/styles.css" />
    </head>
    <body class="centered-page">
        <div class="container">
            <div class="panel Formularioa" id="form_div">
                <form action="../config/add_item.php" name="formularioa" id="item_add_form" method="POST">
                    <h1 style="text-align: center;">KARTA GEHITU</h1>
                    <div>
                        <label for="Izena">Izena</label>
                        <input type="text" name="karta_izena" id="izena" placeholder="Sartu kartaren izena" required>
                    </div>
                    <br>
                    <div>
                        <label for="Kostua">Kostua</label>
                        <input type="text" name="karta_kostua" id="kostua" placeholder="Sartu kartaren kostua" required>
                    </div>
                    <br>
                    <div>
                        <label for="Bizitza">Bizitza</label>
                        <input type="text" name="karta_bizitza" id="bizitza" placeholder="Sartu kartaren bizitza" required>
                    </div>
                    <br>
                    <div>
                        <label for="Erasoa">Erasoa</label>
                        <input type="text" name="karta_erasoa" id="erasoa" placeholder="Sartu kartaren erasoa" required>
                    </div>
                    <br>
                    <div>
                        <label for="Mota">Mota</label>
                        <input type="text" name="karta_mota" id="mota" placeholder="Sartu kartaren mota" required>
                    </div>
                    <div class="buttons">
                        <a class="btn" type="button" id="atzera"  href="../" role="button" style="margin-top: 1rem;">
                            <img src="../img/atzera.png" width="50" height="50">
                        </a>
                        <button class="btn primary" type="submit" id="item_add_submit" style="margin-top: 1rem;">
                            <img src="../img/bidali.png" width="50" height="50">
                        </button>
                        <button class="btn danger" type="reset" id="item_add_reset" style="margin-top: 1rem;">
                            <img src="../img/ezabatu.png" width="50" height="50">
                        </button>
                    </div>
                </form>
            </div>
        </div>
        <script src="../js/add_item.js"></script>
    </body>
</html>
