<!DOCTYPE html>
<html lang="es">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width,initial-scale=1" />
        <title>Erakutsi karta</title>
        <link rel="stylesheet" href="../css/styles.css" />
    </head>
    <body>
        <div class="site-header">
            <h1 id="card-title"></h1>
        </div>
        <div class="container">
            <table class="users" aria-describedby="show-title">
                <thead>
                    <tr>
                        <th>Izena</th>
                        <th>Kostua</th>
                        <th>Bizitza</th>
                        <th>Erasoa</th>
                        <th>Mota</th>
                    </tr>
                </thead>
                <tbody id="item-tbody">
                    <tr>
                        <td colspan="5" style="text-align:center;color:var(--muted);padding:1rem;">Datuak kargatzen...</td>
                    </tr>
                </tbody>
            </table>
            <div class="buttons">
                <a class="btn" href="../" role="button" style="margin-top: 1rem;">Atzera</a>
                <a class="btn" id="edit-button" href="../modify_item/" style="margin-top: 1rem;" role="button">Karta editatu</a>
            </div>
        </div>
        <script src="../js/show_items.js"></script>
        <footer class="site-footer">
            <small>Zibergalaktikoak</small>
        </footer>
    </body>
</html>
